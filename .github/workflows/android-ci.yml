name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Write secrets.properties
        run: |
          cat > secrets.properties << 'EOF'
          PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}"
          TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}"
          OPEN_WEATHER_FORECAST_API_KEY="${{ secrets.OPEN_WEATHER_FORECAST_API_KEY }}"
          EOF

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs=-Xmx4g

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs=-Xmx4g --continue

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
